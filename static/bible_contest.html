<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启示录练讲比赛 - 出场顺序抽签</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d1b2a 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* 星空背景 */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 0;
        }
        .star {
            position: absolute; width: 2px; height: 2px;
            background: #fff; border-radius: 50%; animation: twinkle 3s infinite;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* 导航栏 */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            z-index: 1000; padding: 15px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-brand { display: flex; align-items: center; gap: 15px; }
        .nav-brand .cross { font-size: 1.5rem; color: #ffd700; animation: glow 2s ease-in-out infinite; }
        .nav-brand span {
            font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-link {
            color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.95rem;
            font-weight: 500; padding: 8px 16px; border-radius: 20px;
            transition: all 0.3s ease; position: relative;
        }
        .nav-link:hover, .nav-link.active { color: #ffd700; background: rgba(255,215,0,0.1); }
        .nav-link::after {
            content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 0; height: 2px; background: #ffd700; transition: width 0.3s ease;
        }
        .nav-link:hover::after, .nav-link.active::after { width: 60%; }

        /* 音乐播放器 */
        .music-player {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3);
            border-radius: 30px; padding: 8px 20px; cursor: pointer; transition: all 0.3s ease;
        }
        .music-player:hover { background: rgba(255,215,0,0.2); box-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .music-player.playing { animation: pulse-border 1.5s ease-in-out infinite; }
        @keyframes pulse-border { 0%, 100% { border-color: rgba(255,215,0,0.3); } 50% { border-color: rgba(255,215,0,0.8); } }
        .music-icon { font-size: 1.2rem; color: #ffd700; }
        .music-text { font-size: 0.85rem; color: #ffd700; }

        /* 文件选择 */
        .file-input-wrapper { position: relative; display: inline-block; }
        .file-input-wrapper input[type="file"] {
            position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }
        .btn-file {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff; padding: 8px 16px; font-size: 0.85rem;
            border-radius: 20px; display: flex; align-items: center; gap: 5px;
        }
        .btn-file:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(17,153,142,0.4); }
        .music-filename {
            font-size: 0.75rem; color: rgba(255,255,255,0.6);
            max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* 主容器 */
        .container {
            position: relative; z-index: 1; max-width: 1400px;
            margin: 0 auto; padding: 90px 20px 30px;
        }

        /* 标题 */
        .header { text-align: center; margin-bottom: 30px; }
        .title {
            font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900;
            background: linear-gradient(90deg, #ffd700, #ffed4e, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: 4px; margin-bottom: 8px;
        }
        .subtitle { font-size: 1.1rem; color: #a0c4ff; letter-spacing: 8px; text-transform: uppercase; }

        .cross-divider {
            display: flex; align-items: center; justify-content: center;
            margin: 20px 0; gap: 20px;
        }
        .cross-divider::before, .cross-divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
        }
        .cross-icon { font-size: 1.8rem; color: #ffd700; animation: glow 2s ease-in-out infinite; }
        @keyframes glow { 0%, 100% { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700; } 50% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700; } }

        /* 输入区域 */
        .input-section {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.3);
            border-radius: 20px; padding: 25px 30px; margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .section-title {
            font-size: 1.3rem; color: #ffd700; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::before { content: '✦'; color: #ffd700; }
        .input-group { display: flex; gap: 15px; margin-bottom: 10px; }
        .name-input {
            flex: 1; padding: 12px 20px; font-size: 1rem;
            background: rgba(0,0,0,0.3); border: 2px solid rgba(160,196,255,0.3);
            border-radius: 12px; color: #fff; outline: none; transition: all 0.3s ease;
        }
        .name-input:focus { border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .name-input::placeholder { color: rgba(255,255,255,0.4); }
        .input-hint { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-left: 5px; margin-bottom: 10px; }

        .btn {
            padding: 12px 30px; font-size: 1rem; font-weight: 700; border: none;
            border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            letter-spacing: 2px; position: relative; overflow: hidden;
        }
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff;
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .btn-add::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .btn-add:hover::before { left: 100%; }

        /* 选手标签 */
        .players-list { display: flex; flex-wrap: wrap; gap: 10px; min-height: 40px; }
        .player-tag {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px;
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05));
            border: 1px solid rgba(255,215,0,0.4); border-radius: 30px;
            color: #ffd700; font-weight: 600; animation: fadeIn 0.3s ease; font-size: 0.95rem;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .player-tag .remove-btn {
            background: none; border: none; color: #ff6b6b; font-size: 1.1rem;
            cursor: pointer; padding: 0; width: 22px; height: 22px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.2s;
        }
        .player-tag .remove-btn:hover { background: rgba(255,107,107,0.2); }
        .empty-hint { color: rgba(255,255,255,0.4); font-style: italic; padding: 15px; }

        /* ========== 核心：抽签主区域（左右并排） ========== */
        .draw-main-section {
            display: none;
            gap: 30px;
            margin-top: 25px;
        }
        .draw-main-section.active {
            display: flex;
        }

        /* 左侧：抽签动画 */
        .draw-left {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .draw-display {
            width: 280px; height: 280px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(160,196,255,0.1));
            border: 3px solid rgba(255,215,0,0.5);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 60px rgba(255,215,0,0.2), inset 0 0 60px rgba(255,215,0,0.1);
        }
        .draw-display::before {
            content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2px dashed rgba(255,215,0,0.3); animation: rotate 20s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .draw-display::after { content: '✝'; position: absolute; font-size: 3.5rem; color: rgba(255,215,0,0.3); }
        .draw-name {
            font-size: 2.2rem; font-weight: 700; color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.8); z-index: 1;
            min-height: 50px; display: flex; align-items: center; justify-content: center;
        }
        .draw-name.rolling { animation: pulse 0.1s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* 按钮组 */
        .draw-buttons {
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
        }
        .btn-draw {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            color: #1a1a3e; font-size: 1.2rem; padding: 15px 40px;
            border-radius: 50px; box-shadow: 0 10px 40px rgba(255,215,0,0.4);
        }
        .btn-draw:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 50px rgba(255,215,0,0.6); }
        .btn-draw:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-stop {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: #fff; font-size: 1.2rem; padding: 15px 40px;
            border-radius: 50px; animation: shake 0.5s ease-in-out infinite;
        }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .btn-stop:hover { animation: none; transform: scale(1.05); }
        .btn-auto {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: #fff; font-size: 1.2rem; padding: 15px 40px;
            border-radius: 50px; box-shadow: 0 10px 40px rgba(0,114,255,0.4);
        }
        .btn-auto:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 50px rgba(0,114,255,0.6); }
        .btn-auto:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-reset {
            background: transparent; border: 2px solid rgba(255,255,255,0.3);
            color: #fff; padding: 12px 30px; font-size: 0.95rem;
        }
        .btn-reset:hover { border-color: #ffd700; color: #ffd700; }

        /* 右侧：结果列表 */
        .draw-right {
            flex: 1;
            min-width: 0;
        }
        .results-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 15px;
        }
        .results-header .section-title { margin-bottom: 0; }
        .results-count {
            font-size: 0.9rem; color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.05); padding: 5px 15px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        }

        /* 结果列表 - 紧凑表格风格 */
        .results-table {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            padding-right: 5px;
        }
        .results-table::-webkit-scrollbar { width: 4px; }
        .results-table::-webkit-scrollbar-track { background: transparent; }
        .results-table::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 4px; }

        .result-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 12px;
            animation: slideIn 0.4s ease;
            transition: all 0.3s ease;
        }
        .result-row:hover {
            background: rgba(255,215,0,0.08);
            border-color: rgba(255,215,0,0.4);
            transform: translateX(5px);
        }
        .result-row.highlight {
            background: rgba(255,215,0,0.15);
            border-color: rgba(255,215,0,0.6);
            box-shadow: 0 0 20px rgba(255,215,0,0.2);
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        .result-order {
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900;
            background: linear-gradient(180deg, #ffd700, #ffed4e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            min-width: 50px; text-align: center;
        }
        .result-info { flex: 1; }
        .result-player-name { font-size: 1.3rem; font-weight: 700; color: #fff; }
        .result-verse {
            font-size: 0.75rem; color: rgba(255,255,255,0.5);
            margin-top: 3px; font-style: italic;
        }
        .result-badge {
            font-size: 0.75rem; color: #a0c4ff; letter-spacing: 2px;
            background: rgba(160,196,255,0.1); padding: 4px 12px;
            border-radius: 20px; border: 1px solid rgba(160,196,255,0.2);
            white-space: nowrap;
        }

        .results-empty {
            text-align: center; padding: 40px 20px;
            color: rgba(255,255,255,0.3); font-style: italic;
        }

        /* 页脚 */
        .footer {
            text-align: center; margin-top: 30px; padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .footer-text { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
        .footer-verse { color: #a0c4ff; font-style: italic; margin-top: 8px; font-size: 0.85rem; }

        /* 响应式 */
        @media (max-width: 900px) {
            .draw-main-section.active { flex-direction: column; }
            .draw-left { flex: none; width: 100%; }
            .draw-display { width: 220px; height: 220px; }
            .draw-name { font-size: 1.8rem; }
            .results-table { max-height: 50vh; }
        }
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .nav-links { gap: 10px; }
            .nav-link { font-size: 0.8rem; padding: 6px 10px; }
            .music-player { padding: 6px 12px; }
            .music-text { display: none; }
            .btn-file { padding: 6px 12px; font-size: 0.75rem; }
            .music-filename { display: none; }
            .container { padding: 80px 15px 20px; }
            .title { font-size: 1.8rem; }
            .input-group { flex-direction: column; }
            .btn { width: 100%; }
            .draw-buttons { flex-direction: column; width: 100%; }
            .draw-buttons .btn { width: 100%; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>

<nav class="navbar">
    <div class="nav-brand">
        <span class="cross">✝</span>
        <span>APOCALYPSE</span>
    </div>
    <div class="nav-links">
        <a href="启示录抽签.html" class="nav-link active">抽签</a>
        <a href="启示录评分.html" class="nav-link">评分规则</a>
        <div class="file-input-wrapper">
            <div class="btn btn-file"><span>📁</span><span>选择音乐</span></div>
            <input type="file" id="musicFileInput" accept="audio/*" onchange="loadLocalMusic(this)">
        </div>
        <span class="music-filename" id="musicFileName"></span>
        <div class="music-player" id="musicPlayer" onclick="toggleMusic()">
            <span class="music-icon" id="musicIcon">🎵</span>
            <span class="music-text" id="musicText">播放</span>
        </div>
    </div>
</nav>

<audio id="bgMusic" loop></audio>

<div class="container">
    <header class="header">
        <h1 class="title">APOCALYPSE</h1>
        <p class="subtitle">启示录练讲比赛</p>
        <div class="cross-divider"><span class="cross-icon">✝</span></div>
    </header>

    <!-- 输入区域 -->
    <section class="input-section">
        <h2 class="section-title">添加参赛选手</h2>
        <div class="input-group">
            <input type="text" class="name-input" id="nameInput" placeholder="请输入选手姓名，支持顿号分隔批量添加..." maxlength="200">
            <button class="btn btn-add" onclick="addPlayer()">添加选手</button>
        </div>
        <div class="input-hint">💡 提示：可输入「张三、李四、王五」一键添加多个选手</div>
        <div class="players-list" id="playersList">
            <span class="empty-hint">暂无选手，请添加参赛选手...</span>
        </div>
    </section>

    <!-- 抽签主区域：左右并排 -->
    <section class="draw-main-section" id="drawMainSection">
        <!-- 左侧：抽签动画 -->
        <div class="draw-left">
            <div class="draw-display">
                <div class="draw-name" id="drawName">准备开始</div>
            </div>
            <div class="draw-buttons">
                <button class="btn btn-draw" id="drawBtn" onclick="startDraw()">开始抽签</button>
                <button class="btn btn-auto" id="autoBtn" onclick="autoDrawAll()">一键抽签</button>
            </div>
            <button class="btn btn-reset" onclick="resetAll()">重新开始</button>
        </div>

        <!-- 右侧：结果列表 -->
        <div class="draw-right">
            <div class="results-header">
                <h2 class="section-title">出场顺序</h2>
                <span class="results-count" id="resultsCount">共 0 人</span>
            </div>
            <div class="results-table" id="resultsTable">
                <div class="results-empty">等待抽签...</div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p class="footer-text">愿神祝福每一位参赛者的分享</p>
        <p class="footer-verse">「你要大声喊叫，不可止息，扬起声来，好像吹角。」— 以赛亚书 58:1</p>
    </footer>
</div>

<script>
    let players = [];
    let results = [];
    let isDrawing = false;
    let isAutoDrawing = false;
    let drawInterval = null;
    let remainingPlayers = [];

    const verses = [
        "「启示录是耶稣基督的启示」— 启示录 1:1",
        "「念这书上预言的和那些听见又遵守其中所记载的，都是有福的」— 启示录 1:3",
        "「我是阿拉法，我是俄梅戛」— 启示录 1:8",
        "「不要惧怕！我是首先的，我是末后的」— 启示录 1:17",
        "「圣灵向众教会所说的话，凡有耳的，就应当听」— 启示录 2:7",
        "「得胜的，我必将神乐园中生命树的果子赐给他吃」— 启示录 2:7",
        "「看哪，我站在门外叩门」— 启示录 3:20",
        "「宝座中的羔羊是配得权柄、丰富、智慧、能力、尊贵、荣耀、颂赞的」— 启示录 5:12",
        "「从今以后，在主里面而死的人有福了」— 启示录 14:13",
        "「看哪，我必快来！赏罚在我，要照各人所行的报应他」— 启示录 22:12",
        "「证明这事的说：是了，我必快来！阿们！主耶稣啊，我愿你来！」— 启示录 22:20"
    ];

    // 音乐
    let isPlaying = false;
    let currentMusicUrl = null;
    const musicPlayer = document.getElementById('musicPlayer');
    const musicIcon = document.getElementById('musicIcon');
    const musicText = document.getElementById('musicText');
    const bgMusic = document.getElementById('bgMusic');
    const musicFileName = document.getElementById('musicFileName');

    function loadLocalMusic(input) {
        const file = input.files[0];
        if (!file) return;
        if (currentMusicUrl) URL.revokeObjectURL(currentMusicUrl);
        currentMusicUrl = URL.createObjectURL(file);
        bgMusic.src = currentMusicUrl;
        musicFileName.textContent = file.name;
        if (isPlaying) { bgMusic.play().catch(e => console.error(e)); }
        else { toggleMusic(); }
    }

    function toggleMusic() {
        if (!bgMusic.src) { alert('请先选择音乐文件'); return; }
        if (isPlaying) {
            bgMusic.pause();
            musicIcon.textContent = '🎵'; musicText.textContent = '播放';
            musicPlayer.classList.remove('playing');
        } else {
            bgMusic.play().catch(e => { alert('无法播放音乐'); console.error(e); });
            musicIcon.textContent = '⏸'; musicText.textContent = '暂停';
            musicPlayer.classList.add('playing');
        }
        isPlaying = !isPlaying;
    }

    // 星空
    function createStars() {
        const c = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random()*100+'%';
            s.style.top = Math.random()*100+'%';
            s.style.animationDelay = Math.random()*3+'s';
            s.style.opacity = Math.random();
            c.appendChild(s);
        }
    }

    // 添加选手
    function addPlayer() {
        const input = document.getElementById('nameInput');
        const raw = input.value.trim();
        if (!raw) { alert('请输入选手姓名'); return; }
        const names = raw.split(/[、,，\s]+/).filter(n => n.trim());
        if (!names.length) { alert('请输入有效的选手姓名'); return; }
        let added = 0, dupes = [];
        names.forEach(n => {
            const t = n.trim();
            if (players.includes(t)) dupes.push(t);
            else { players.push(t); added++; }
        });
        if (added > 0 && dupes.length > 0) alert(`已添加 ${added} 人，以下重复已跳过：${dupes.join('、')}`);
        else if (dupes.length > 0 && added === 0) alert(`以下选手已存在：${dupes.join('、')}`);
        input.value = ''; input.focus();
        updatePlayersList(); updateDrawSection();
    }

    function removePlayer(i) { players.splice(i,1); updatePlayersList(); updateDrawSection(); }

    function updatePlayersList() {
        const list = document.getElementById('playersList');
        if (!players.length) { list.innerHTML = '<span class="empty-hint">暂无选手，请添加参赛选手...</span>'; return; }
        list.innerHTML = players.map((n,i) => `<div class="player-tag"><span>${n}</span><button class="remove-btn" onclick="removePlayer(${i})">×</button></div>`).join('');
    }

    function updateDrawSection() {
        const s = document.getElementById('drawMainSection');
        s.classList.toggle('active', players.length >= 2);
    }

    // 开始抽签（手动模式）
    function startDraw() {
        if (isDrawing || isAutoDrawing) return;
        if (remainingPlayers.length === 0) {
            remainingPlayers = [...players]; results = [];
            clearResults();
        }
        isDrawing = true;
        const drawBtn = document.getElementById('drawBtn');
        const autoBtn = document.getElementById('autoBtn');
        const drawName = document.getElementById('drawName');
        drawBtn.textContent = '停止'; drawBtn.className = 'btn btn-stop'; drawBtn.onclick = stopDraw;
        autoBtn.disabled = true;
        drawName.classList.add('rolling');
        drawInterval = setInterval(() => {
            drawName.textContent = remainingPlayers[Math.floor(Math.random()*remainingPlayers.length)];
        }, 80);
    }

    // 停止抽签（手动模式）
    function stopDraw() {
        if (!isDrawing) return;
        clearInterval(drawInterval); isDrawing = false;
        const drawBtn = document.getElementById('drawBtn');
        const autoBtn = document.getElementById('autoBtn');
        const drawName = document.getElementById('drawName');
        drawName.classList.remove('rolling');
        const idx = Math.floor(Math.random()*remainingPlayers.length);
        const selected = remainingPlayers.splice(idx, 1)[0];
        results.push(selected);
        drawName.textContent = selected;
        drawName.style.animation = 'glow 1s ease-in-out 3';
        addResultRow(results.length, selected);
        highlightRow(results.length - 1);
        if (remainingPlayers.length > 0) {
            setTimeout(() => {
                drawBtn.textContent = '下一位'; drawBtn.className = 'btn btn-draw'; drawBtn.onclick = startDraw;
                autoBtn.disabled = false;
                drawName.textContent = '准备开始'; drawName.style.animation = '';
            }, 1500);
        } else {
            finishDraw();
        }
    }

    // 一键抽签
    function autoDrawAll() {
        if (isDrawing || isAutoDrawing) return;
        if (remainingPlayers.length === 0) {
            remainingPlayers = [...players]; results = [];
            clearResults();
        }
        isAutoDrawing = true;
        const drawBtn = document.getElementById('drawBtn');
        const autoBtn = document.getElementById('autoBtn');
        drawBtn.disabled = true;
        autoBtn.textContent = '抽签中...'; autoBtn.disabled = true;
        autoBtn.className = 'btn btn-auto';

        const drawName = document.getElementById('drawName');
        let round = 0;

        function drawNext() {
            if (remainingPlayers.length === 0) {
                isAutoDrawing = false;
                finishDraw();
                return;
            }
            drawName.classList.add('rolling');
            // 滚动动画 1.5秒
            drawInterval = setInterval(() => {
                drawName.textContent = remainingPlayers[Math.floor(Math.random()*remainingPlayers.length)];
            }, 60);

            setTimeout(() => {
                clearInterval(drawInterval);
                drawName.classList.remove('rolling');
                const idx = Math.floor(Math.random()*remainingPlayers.length);
                const selected = remainingPlayers.splice(idx, 1)[0];
                results.push(selected);
                round++;
                drawName.textContent = selected;
                drawName.style.animation = 'glow 1s ease-in-out 2';
                addResultRow(results.length, selected);
                highlightRow(results.length - 1);
                // 滚动到最新结果
                const table = document.getElementById('resultsTable');
                table.scrollTop = table.scrollHeight;
                setTimeout(() => {
                    drawName.style.animation = '';
                    drawNext();
                }, 800);
            }, 1500);
        }
        drawNext();
    }

    // 添加结果行
    function addResultRow(order, name) {
        const table = document.getElementById('resultsTable');
        // 移除空提示
        const empty = table.querySelector('.results-empty');
        if (empty) empty.remove();
        const verse = verses[Math.floor(Math.random()*verses.length)];
        const row = document.createElement('div');
        row.className = 'result-row';
        row.id = 'result-' + order;
        row.innerHTML = `
            <div class="result-order">${order}</div>
            <div class="result-info">
                <div class="result-player-name">${name}</div>
                <div class="result-verse">${verse}</div>
            </div>
            <div class="result-badge">第${order}位出场</div>
        `;
        table.appendChild(row);
        document.getElementById('resultsCount').textContent = `共 ${results.length} / ${players.length} 人`;
    }

    // 高亮最新结果
    function highlightRow(index) {
        document.querySelectorAll('.result-row').forEach(r => r.classList.remove('highlight'));
        const row = document.getElementById('result-' + (index + 1));
        if (row) row.classList.add('highlight');
    }

    // 清空结果
    function clearResults() {
        document.getElementById('resultsTable').innerHTML = '<div class="results-empty">等待抽签...</div>';
        document.getElementById('resultsCount').textContent = '共 0 人';
    }

    // 抽签完成
    function finishDraw() {
        const drawBtn = document.getElementById('drawBtn');
        const autoBtn = document.getElementById('autoBtn');
        const drawName = document.getElementById('drawName');
        drawBtn.style.display = 'none';
        autoBtn.style.display = 'none';
        drawName.textContent = '✝';
        drawName.style.fontSize = '3rem';
        document.getElementById('resultsCount').textContent = `共 ${results.length} 人 · 抽签完成`;
    }

    // 重置
    function resetAll() {
        if (confirm('确定要重新开始吗？所有数据将被清空。')) {
            players = []; results = []; remainingPlayers = [];
            isDrawing = false; isAutoDrawing = false;
            clearInterval(drawInterval);
            document.getElementById('playersList').innerHTML = '<span class="empty-hint">暂无选手，请添加参赛选手...</span>';
            document.getElementById('drawMainSection').classList.remove('active');
            clearResults();
            const drawBtn = document.getElementById('drawBtn');
            const autoBtn = document.getElementById('autoBtn');
            const drawName = document.getElementById('drawName');
            drawBtn.style.display = ''; drawBtn.textContent = '开始抽签';
            drawBtn.className = 'btn btn-draw'; drawBtn.onclick = startDraw; drawBtn.disabled = false;
            autoBtn.style.display = ''; autoBtn.textContent = '一键抽签';
            autoBtn.className = 'btn btn-auto'; autoBtn.disabled = false;
            drawName.textContent = '准备开始'; drawName.style.fontSize = '';
            drawName.style.animation = '';
            document.getElementById('nameInput').value = '';
        }
    }

    document.getElementById('nameInput').addEventListener('keypress', e => { if (e.key === 'Enter') addPlayer(); });
    createStars();
</script>
</body>
</html>
