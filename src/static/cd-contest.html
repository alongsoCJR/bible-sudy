<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞赛舞台 — 海聚英才 · 淀筑渔台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg0: #0b1224;
            --bg1: #132044;
            --bg2: #1a2f5c;
            --cyan: #4de1ff;
            --cyan-soft: #7ef0ff;
            --gold: #ffd76a;
            --gold-bright: #ffe9a3;
            --blue: #9ec5ff;
            --panel: rgba(255,255,255,0.08);
            --line: rgba(77, 225, 255, 0.28);
            --text: #f5f8ff;
            --muted: rgba(245, 248, 255, 0.55);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(145deg, var(--bg0), var(--bg1) 45%, #0e1a38 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stars {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .star {
            position: absolute; width: 2px; height: 2px; background: #fff;
            border-radius: 50%; animation: twinkle 3s infinite;
        }
        .grid-overlay {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(77,225,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77,225,255,0.05) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        }
        .glow-orb {
            position: fixed; border-radius: 50%; filter: blur(60px); pointer-events: none; z-index: 0;
        }
        .glow-orb.a {
            width: 420px; height: 420px; top: -80px; left: 20%;
            background: rgba(77, 225, 255, 0.22); animation: floatOrb 10s ease-in-out infinite;
        }
        .glow-orb.b {
            width: 360px; height: 360px; bottom: 5%; right: 8%;
            background: rgba(255, 215, 106, 0.16); animation: floatOrb 12s ease-in-out infinite reverse;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        @keyframes floatOrb {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(24px); }
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(255,215,106,0.6), 0 0 24px rgba(77,225,255,0.35); }
            50% { text-shadow: 0 0 18px rgba(255,215,106,0.9), 0 0 36px rgba(77,225,255,0.55); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.94) translateY(18px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes pulseBorder {
            0%, 100% { border-color: rgba(77,225,255,0.25); box-shadow: 0 0 0 rgba(77,225,255,0); }
            50% { border-color: rgba(77,225,255,0.7); box-shadow: 0 0 28px rgba(77,225,255,0.2); }
        }

        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 36px;
            background: rgba(11, 18, 36, 0.82);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(77, 225, 255, 0.2);
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 0.12em;
            font-size: 1.05rem;
            background: linear-gradient(90deg, var(--gold), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-brand .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 12px var(--cyan);
            -webkit-text-fill-color: initial;
            animation: twinkle 1.6s infinite;
        }
        .nav-links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .nav-link {
            color: var(--muted); text-decoration: none; font-size: 0.88rem;
            padding: 8px 14px; border-radius: 999px; transition: all 0.3s var(--ease);
        }
        .nav-link:hover, .nav-link.active {
            color: var(--gold); background: rgba(255, 215, 106, 0.12);
        }
        .edit-toggle {
            font-family: inherit; font-size: 0.82rem; letter-spacing: 0.04em;
            padding: 8px 14px; border-radius: 999px; cursor: pointer;
            border: 1px solid rgba(77,225,255,0.35);
            background: rgba(77,225,255,0.08); color: var(--cyan-soft);
            transition: all 0.3s var(--ease);
        }
        .edit-toggle:hover, .edit-toggle.on {
            background: linear-gradient(135deg, var(--cyan), #3aa0ff);
            color: #061018; border-color: transparent;
        }

        .hero {
            position: relative; z-index: 1;
            text-align: center;
            padding: 110px 20px 28px;
            animation: fadeUp 0.9s var(--ease) both;
        }
        .hero-kicker {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.35em;
            color: var(--cyan);
            margin-bottom: 14px;
        }
        .hero-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.4rem, 7vw, 4.4rem);
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1.15;
            background: linear-gradient(90deg, var(--gold), #fff3c4, var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: glow 3s ease-in-out infinite;
            margin-bottom: 12px;
        }
        .hero-theme {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(1.05rem, 2vw, 1.3rem);
            color: rgba(245,248,255,0.88);
            margin-bottom: 6px;
        }
        .hero-sub {
            font-size: 0.95rem;
            letter-spacing: 0.14em;
            color: var(--blue);
        }
        .cross-divider {
            display: flex; align-items: center; justify-content: center;
            gap: 16px; margin: 22px auto 0; max-width: 520px;
        }
        .cross-divider::before, .cross-divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        }
        .cross-icon { color: var(--gold); font-size: 1.4rem; animation: glow 2s ease-in-out infinite; }

        .layout {
            position: relative; z-index: 1;
            max-width: 1240px;
            margin: 0 auto;
            padding: 10px 20px 48px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 22px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 22px;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
            animation: fadeUp 0.8s var(--ease) both;
        }

        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            color: var(--cyan);
            margin-bottom: 8px;
        }
        .section-title {
            font-size: 1.25rem;
            color: var(--gold);
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::before { content: '✦'; }

        /* —— Music Dock —— */
        #cdMusicDock.is-playing .cdm-shell { animation: pulseBorder 1.8s ease-in-out infinite; }
        .cdm-shell { border-radius: 16px; }
        .cdm-top {
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; margin-bottom: 14px;
        }
        .cdm-brand { display: flex; align-items: center; gap: 10px; }
        .cdm-pulse {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 14px var(--cyan);
        }
        #cdMusicDock.is-playing .cdm-pulse { animation: twinkle 0.8s infinite; background: var(--gold); box-shadow: 0 0 16px var(--gold); }
        .cdm-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            color: var(--gold);
        }
        .cdm-now { font-size: 0.78rem; color: var(--muted); margin-top: 2px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cdm-controls { display: flex; gap: 8px; }
        .cdm-btn {
            width: 38px; height: 38px; border-radius: 50%;
            border: 1px solid rgba(77,225,255,0.35);
            background: rgba(77,225,255,0.1);
            color: var(--cyan-soft);
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            transition: all 0.25s var(--ease);
        }
        .cdm-btn:hover { background: rgba(255,215,106,0.18); border-color: var(--gold); color: var(--gold); }
        .cdm-play {
            background: linear-gradient(135deg, var(--gold), #ffb84d);
            color: #1a1208; border: none; font-weight: 700;
        }
        .cdm-file { position: relative; overflow: hidden; }
        .cdm-phases {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;
        }
        .cdm-phase {
            font-family: inherit;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.2);
            color: var(--muted);
            border-radius: 12px;
            padding: 10px 6px;
            cursor: pointer;
            transition: all 0.25s var(--ease);
        }
        .cdm-phase-icon { display: block; font-size: 1rem; margin-bottom: 4px; }
        .cdm-phase-label { display: block; font-size: 0.72rem; letter-spacing: 0.04em; }
        .cdm-phase.active, .cdm-phase:hover {
            color: #061018;
            background: linear-gradient(135deg, var(--cyan), #5ab0ff);
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(77,225,255,0.25);
        }
        .cdm-quick {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;
        }
        .cdm-quick-btn {
            font-family: inherit; font-size: 0.75rem; letter-spacing: 0.04em;
            padding: 8px 4px; border-radius: 10px; cursor: pointer;
            border: 1px solid rgba(255,215,106,0.3);
            background: rgba(255,215,106,0.08);
            color: var(--gold-bright);
            transition: all 0.25s var(--ease);
        }
        .cdm-quick-btn:hover {
            background: linear-gradient(135deg, var(--gold), #ffb84d);
            color: #1a1208; border-color: transparent;
        }
        .cdm-tracks {
            display: flex; flex-direction: column; gap: 6px;
            max-height: 320px; overflow-y: auto; padding-right: 4px;
        }
        .cdm-tracks::-webkit-scrollbar { width: 4px; }
        .cdm-tracks::-webkit-scrollbar-thumb { background: rgba(77,225,255,0.35); border-radius: 4px; }
        .cdm-track {
            text-align: left;
            font-family: inherit;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            cursor: pointer;
            transition: all 0.25s var(--ease);
        }
        .cdm-track:hover, .cdm-track.active {
            border-color: rgba(77,225,255,0.5);
            background: rgba(77,225,255,0.12);
            transform: translateX(3px);
        }
        .cdm-track-title { display: block; font-size: 0.9rem; font-weight: 600; }
        .cdm-track-meta { display: block; font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
        .cdm-credit {
            margin-top: 12px;
            font-size: 0.68rem;
            color: rgba(245,248,255,0.35);
            line-height: 1.5;
        }

        .arena-head {
            display: flex; justify-content: space-between; align-items: end;
            gap: 12px; margin-bottom: 16px;
        }
        .team-count-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--cyan);
            letter-spacing: 0.08em;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(77,225,255,0.3);
            background: rgba(77,225,255,0.08);
        }

        .arena {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }
        .marque {
            position: relative;
            padding: 20px 18px;
            background: linear-gradient(160deg, rgba(77,225,255,0.1), rgba(255,215,106,0.05) 45%, rgba(255,255,255,0.04));
            border: 1px solid rgba(77,225,255,0.28);
            border-radius: 16px;
            animation: scaleIn 0.65s var(--ease) both;
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }
        .marque:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(77,225,255,0.15);
        }
        .marque::before {
            content: '';
            position: absolute; top: 0; left: 18px; right: 18px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), transparent);
            border-radius: 2px;
        }
        .marque-index {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            color: var(--cyan);
            margin-bottom: 10px;
        }
        .marque-name {
            font-size: clamp(1.3rem, 2.5vw, 1.65rem);
            font-weight: 700;
            color: var(--gold-bright);
            margin-bottom: 8px;
            word-break: break-word;
        }
        .marque-slogan {
            font-size: 0.92rem;
            color: rgba(245,248,255,0.75);
            font-style: italic;
            min-height: 1.4em;
            margin-bottom: 14px;
        }
        .marque-slogan.is-empty { color: rgba(245,248,255,0.3); font-style: normal; }
        .marque-divider {
            height: 1px; background: rgba(255,255,255,0.1); margin-bottom: 12px;
        }
        .members { display: flex; flex-wrap: wrap; gap: 6px; }
        .member {
            font-size: 0.8rem; padding: 4px 10px; border-radius: 999px;
            background: rgba(77,225,255,0.1); border: 1px solid rgba(77,225,255,0.25);
        }
        .member-count {
            margin-top: 12px; font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem; letter-spacing: 0.1em; color: var(--muted);
        }

        .edit-field {
            width: 100%; font-family: inherit; margin-bottom: 8px;
            padding: 10px 12px; border-radius: 10px; outline: none;
            background: rgba(0,0,0,0.28); border: 1px solid rgba(77,225,255,0.3); color: var(--text);
        }
        .edit-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,106,0.15); }
        .edit-name { font-size: 1.15rem; font-weight: 700; color: var(--gold-bright); }
        .edit-slogan::placeholder { color: rgba(245,248,255,0.3); }

        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 48px 20px;
            border: 1px dashed rgba(77,225,255,0.3); border-radius: 16px;
            background: rgba(255,255,255,0.03);
        }
        .empty-state p { color: var(--muted); margin-bottom: 16px; }
        .empty-state a {
            display: inline-block; text-decoration: none; color: #061018;
            background: linear-gradient(135deg, var(--gold), #ffb84d);
            padding: 11px 22px; border-radius: 999px; font-weight: 600;
        }

        .rounds {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .round-item {
            text-align: center; padding: 14px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
        }
        .round-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            color: var(--gold);
            margin-bottom: 4px;
        }
        .round-name { font-size: 0.85rem; color: rgba(245,248,255,0.75); }

        .footer {
            position: relative; z-index: 1;
            text-align: center;
            padding: 18px 20px 36px;
            color: var(--blue);
            font-style: italic;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
        }

        .toast {
            position: fixed; left: 50%; bottom: 24px; z-index: 200;
            transform: translateX(-50%) translateY(16px);
            background: linear-gradient(135deg, var(--gold), #ffb84d);
            color: #1a1208; padding: 10px 18px; border-radius: 999px;
            font-size: 0.85rem; opacity: 0; pointer-events: none;
            transition: all 0.3s var(--ease);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 980px) {
            .layout { grid-template-columns: 1fr; }
            .rounds { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .navbar { padding: 12px 14px; }
            .hero { padding: 96px 14px 20px; }
            .layout { padding: 8px 14px 36px; }
            .rounds { grid-template-columns: 1fr; }
            .cdm-phases, .cdm-quick { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="grid-overlay"></div>
<div class="glow-orb a"></div>
<div class="glow-orb b"></div>

<nav class="navbar">
    <div class="nav-brand"><span class="dot"></span>HAIDIAN CD</div>
    <div class="nav-links">
        <a href="cd-activity.html" class="nav-link">活动分队</a>
        <a href="cd-contest.html" class="nav-link active">竞赛页</a>
        <a href="index.html" class="nav-link">首页</a>
        <button type="button" class="edit-toggle" id="editToggle" onclick="toggleEdit()">编辑队名口号</button>
    </div>
</nav>

<header class="hero">
    <p class="hero-kicker">LIVE CONTEST STAGE</p>
    <h1 class="hero-brand">海聚英才 · 淀筑渔台</h1>
    <p class="hero-theme" id="eventTheme">积极传道，感受合一做工的乐趣</p>
    <p class="hero-sub" id="eventSlogan">合一做工，努力传道</p>
    <div class="cross-divider"><span class="cross-icon">✝</span></div>
</header>

<div class="layout">
    <aside class="panel" style="animation-delay:0.05s">
        <div class="section-label">AUDIO SYSTEM</div>
        <h2 class="section-title">比赛音乐台</h2>
        <div id="cdMusicDock"></div>
    </aside>

    <section>
        <div class="panel" style="animation-delay:0.12s">
            <div class="arena-head">
                <div>
                    <div class="section-label">COMPETING TEAMS</div>
                    <h2 class="section-title" style="margin-bottom:0">赛场队伍</h2>
                </div>
                <div class="team-count-badge" id="teamCountBadge">—</div>
            </div>
            <div class="arena" id="arena">
                <div class="empty-state">
                    <p>暂无分队数据，请先完成活动分队</p>
                    <a href="cd-activity.html">前往活动分队 →</a>
                </div>
            </div>
            <div class="rounds">
                <div class="round-item"><div class="round-time">15:00–15:15</div><div class="round-name">寻找 PK</div></div>
                <div class="round-item"><div class="round-time">15:20–15:35</div><div class="round-name">合适 PK</div></div>
                <div class="round-item"><div class="round-time">15:40–15:55</div><div class="round-name">找教师 PK</div></div>
                <div class="round-item"><div class="round-time">16:00</div><div class="round-name">打分排名</div></div>
            </div>
        </div>
    </section>
</div>

<footer class="footer">「你们往普天下去，传福音给万民听。」— 马可福音 16:15</footer>
<div class="toast" id="toast">已保存</div>
<audio id="cdBgMusic" loop preload="none"></audio>

<script src="js/cd-music.js"></script>
<script>
    const STORAGE_KEY = 'cd_activity_teams_v1';
    let teams = [];
    let editMode = false;
    let saveTimer = null;

    function createStars() {
        const c = document.getElementById('stars');
        for (let i = 0; i < 110; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 3 + 's';
            s.style.opacity = String(Math.random());
            if (Math.random() > 0.85) {
                s.style.width = '3px';
                s.style.height = '3px';
                s.style.background = '#4de1ff';
            }
            c.appendChild(s);
        }
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    function escapeAttr(str) {
        return escapeHtml(str).replace(/'/g, '&#39;');
    }

    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 1400);
    }

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) { render(); return; }
            const data = JSON.parse(raw);
            if (data.theme) document.getElementById('eventTheme').textContent = data.theme;
            if (data.slogan) {
                document.getElementById('eventSlogan').textContent =
                    String(data.slogan).split(/[。.]/)[0] || data.slogan;
            }
            teams = Array.isArray(data.teams) ? data.teams.map(t => ({
                id: t.id,
                name: t.name || '',
                slogan: t.slogan || '',
                members: Array.isArray(t.members) ? t.members : []
            })) : [];
        } catch (e) {
            console.warn(e);
            teams = [];
        }
        render();
    }

    function persist(showMsg) {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const data = raw ? JSON.parse(raw) : {};
            data.teams = teams;
            data.updatedAt = Date.now();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            if (showMsg) showToast('已保存修改');
        } catch (e) { console.warn(e); }
    }

    function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => persist(true), 400);
    }

    function toggleEdit() {
        editMode = !editMode;
        document.getElementById('editToggle').classList.toggle('on', editMode);
        document.getElementById('editToggle').textContent = editMode ? '完成编辑' : '编辑队名口号';
        render();
        if (!editMode) persist(true);
    }

    function updateTeam(i, key, value) {
        if (!teams[i]) return;
        teams[i][key] = value;
        scheduleSave();
    }

    function render() {
        const arena = document.getElementById('arena');
        const badge = document.getElementById('teamCountBadge');
        if (!teams.length) {
            badge.textContent = '0 TEAMS';
            arena.innerHTML = `
                <div class="empty-state">
                    <p>暂无分队数据，请先完成活动分队</p>
                    <a href="cd-activity.html">前往活动分队 →</a>
                </div>`;
            return;
        }
        badge.textContent = `${teams.length} TEAMS`;
        arena.innerHTML = teams.map((t, i) => {
            const sloganEmpty = !String(t.slogan || '').trim();
            const nameDisplay = String(t.name || '').trim() || '未命名队伍';
            const body = editMode ? `
                <input class="edit-field edit-name" value="${escapeAttr(t.name)}"
                       placeholder="输入队名"
                       oninput="updateTeam(${i}, 'name', this.value)">
                <input class="edit-field edit-slogan" value="${escapeAttr(t.slogan)}"
                       placeholder="输入口号（不自动填充）"
                       oninput="updateTeam(${i}, 'slogan', this.value)">
            ` : `
                <div class="marque-name">${escapeHtml(nameDisplay)}</div>
                <div class="marque-slogan ${sloganEmpty ? 'is-empty' : ''}">
                    ${sloganEmpty ? '口号待定' : escapeHtml(t.slogan)}
                </div>
            `;
            return `
                <article class="marque" style="animation-delay:${0.08 + i * 0.06}s">
                    <div class="marque-index">TEAM ${String(t.id).padStart(2, '0')}</div>
                    ${body}
                    <div class="marque-divider"></div>
                    <div class="members">
                        ${(t.members || []).map(m => `<span class="member">${escapeHtml(m)}</span>`).join('')}
                    </div>
                    <div class="member-count">${(t.members || []).length} MEMBERS</div>
                </article>
            `;
        }).join('');
    }

    createStars();
    loadState();
    CDMusic.createPlayer({ audioId: 'cdBgMusic', rootId: 'cdMusicDock' });
</script>
</body>
</html>
